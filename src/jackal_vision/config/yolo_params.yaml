# --------------------------------------------------
# jackal_vision — YOLOv8 detector parameters
# --------------------------------------------------

yolo_detector:
  ros__parameters:
    # Path to YOLO model weights. 'yolov8n.pt' will be auto-downloaded
    # by ultralytics on first launch if not already present.
    model_path: 'yolov8n.pt'

    # Minimum confidence score to keep a detection.
    confidence_threshold: 0.40

    # Camera image topic to subscribe to.
    image_topic: '/j100_0000/sensors/camera_0/color/image'

    # Maximum inference rate (Hz).
    detection_rate_hz: 5.0

    # Target class names to detect.
    # Supports common objects, vehicles, humans, and flora/trees (potted plant / tree).
    # If left empty [] or set to ['all'], all 80 COCO classes will be detected.
    target_classes:
      - person
      - bicycle
      - tree
      - potted plant
      - car
      - truck
      - bus
      - motorcycle
      - chair
      - couch
      - bench
      - bottle
      - backpack
      - suitcase
      - traffic light
      - stop sign
      - dog
      - cat

    # Inference device: 'auto' (detects NVIDIA RTX 3070 GPU via CUDA), '0', or 'cpu'.
    device: 'auto'
